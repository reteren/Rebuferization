[package]
name = "rebuffer"
version = "0.1.0"
description = "Persistent clipboard history for Windows"
authors = ["reteren"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "rebuffer_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
blake3 = "1.8.7"
dirs = "6.0.0"
image = { version = "0.25.6", features = ["png", "jpeg", "gif", "webp", "bmp"] }
once_cell = "1.21.4"
parking_lot = "0.12.5"
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
ureq = { version = "3.2.1", default-features = false, features = ["native-tls", "win-system-proxy"] }
urlencoding = "2.1.3"
walkdir = "2.5.0"
webp = "0.3.1"
window-vibrancy = "0.8.0"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_System_Registry", "Win32_Security"] }
windows-core = "0.61"
zip = "5.0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
