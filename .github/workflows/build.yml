name: build

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Action versions are pinned to commit SHAs (with the release each SHA came
# from in a comment) rather than moving tags, so a dependency bump cannot
# silently change what CI runs.
#
# NOTE: the installer is unsigned. Windows SmartScreen will warn on first run
# of a downloaded build — that is expected and belongs in the release notes,
# not in a signing step, because nobody here holds a code-signing certificate.

jobs:
  # Fast feedback job: a typo or lint error surfaces in ~2 minutes instead of
  # after a full Tauri release compile.
  checks:
    name: Checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1 tag commit 2026-08-05
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Install npm dependencies
        run: npm ci
      - name: Format
        run: cargo fmt --check
        working-directory: src-tauri
      - name: Clippy
        run: cargo clippy -- -D warnings
        working-directory: src-tauri
      - name: Test
        run: cargo test
        working-directory: src-tauri
      - name: TypeScript
        run: npx tsc --noEmit
      - name: svelte-check
        run: npm run check

  build:
    name: Build installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1 tag commit 2026-08-05
        with:
          toolchain: stable
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Install npm dependencies
        run: npm ci
      - name: Format
        run: cargo fmt --check
        working-directory: src-tauri
      - name: Clippy
        run: cargo clippy -- -D warnings
        working-directory: src-tauri
      - name: Test
        run: cargo test
        working-directory: src-tauri
      - name: TypeScript
        run: npx tsc --noEmit
      - name: svelte-check
        run: npm run check
      - name: Tauri build (release)
        run: npm run tauri build
      - name: Upload NSIS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rebuffer-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error